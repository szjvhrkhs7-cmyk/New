<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#20120d">
<title>Путевой дневник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#302419;--muted:#735f4c;--paper:#ead7ad;--paper2:#dfc69a;--wine:#702820;--green:#2f4735;--blue:#344f59;--brass:#b58b50}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'EB Garamond',Georgia,serif;color:var(--ink);background:#100a07}button{font:inherit;color:inherit}.scene{min-height:100dvh;display:grid;place-items:center;padding:88px 5vw 72px;position:relative;overflow:hidden;background:radial-gradient(circle at 12% 15%,#54291655,transparent 25%),radial-gradient(circle at 85% 20%,#63361a44,transparent 25%),linear-gradient(120deg,#1d120d,#0b0806 48%,#1a100b)}.brand{position:fixed;right:4vw;top:26px;color:#d7b77e;display:flex;gap:12px;align-items:center;text-shadow:0 2px 8px #000;z-index:20}.brand b{font-family:Cinzel,serif;letter-spacing:.08em;font-size:22px;text-transform:uppercase}.brand small{display:block;letter-spacing:.18em;text-align:right;text-transform:uppercase;color:#bba37c}.book{width:min(1320px,91vw);min-width:780px;min-height:610px;aspect-ratio:1.66/1;position:relative;filter:drop-shadow(0 28px 30px #0009)}.cover{position:absolute;inset:-24px -27px -27px -29px;background:linear-gradient(125deg,#4b251a,#27140f 48%,#3a1c15);border:2px solid #755033;border-radius:16px;box-shadow:inset 0 0 0 6px #1a0e0a,inset 0 0 0 8px #8d663e,inset 0 0 38px #000b;z-index:-3}.tabs{position:absolute;top:-22px;left:54px;display:flex;gap:8px;z-index:10}.tab{height:51px;min-width:112px;padding:0 17px 9px;border:1px solid #d2ae705d;border-bottom:0;border-radius:6px 6px 0 0;color:#ecd5a8;cursor:pointer;box-shadow:inset 0 0 18px #0005}.tab[data-tab=chronicles]{background:linear-gradient(#7d3027,#531d17)}.tab[data-tab=characters]{background:linear-gradient(#3d5843,#24372b)}.tab[data-tab=atlas]{background:linear-gradient(#42616b,#293f48)}.tab.active{height:57px;transform:translateY(-2px);color:#fff0c9}.spread{height:100%;display:grid;grid-template-columns:1fr 1.04fr;overflow:hidden;border-radius:8px;border:1px solid #a28255;background:var(--paper);position:relative}.page{position:relative;padding:42px 46px 34px;overflow:hidden;background:radial-gradient(circle at 18% 12%,#fff7 0,transparent 24%),radial-gradient(circle at 80% 80%,#7d4c210f,transparent 26%),linear-gradient(90deg,#7c53211a,transparent 8%,transparent 91%,#6a45171c),repeating-linear-gradient(0deg,#79512608 0 1px,transparent 1px 4px),linear-gradient(98deg,#efdfba,#e7d2aa 55%,#dcc092)}.page:before{content:"";position:absolute;inset:14px;border:1px solid #6f4f2e2e;pointer-events:none}.page.left{box-shadow:inset -30px 0 30px -28px #2d1a0e99}.page.right{box-shadow:inset 30px 0 30px -28px #2d1a0e99}.gutter{position:absolute;left:49.1%;top:0;bottom:0;width:4%;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#42281736 42%,#2b180f55 50%,#fff2 58%,transparent);pointer-events:none;z-index:5}.kicker{text-transform:uppercase;letter-spacing:.17em;font-size:11px;color:#88684a;margin:0 0 4px}h1,h2{margin:0;line-height:1.02;font-weight:600}h1{font-size:38px}h2{font-size:37px}.meta{color:var(--muted);margin:6px 0 0}.head{display:flex;justify-content:space-between;gap:20px;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid #6d4b2d3c}.mountain{width:180px;opacity:.62;align-self:flex-end}.mountain path,.sketch path{fill:none;stroke:#4a3829;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.days{display:grid;gap:7px}.day{width:100%;min-height:72px;display:grid;grid-template-columns:78px 1fr 20px;align-items:center;gap:14px;padding:8px;border:1px solid transparent;border-radius:8px;background:#ffffff10;text-align:left;cursor:pointer}.day:hover{background:#855d2b12}.day.active{background:#f5ddae7a;border-color:#815a323f;box-shadow:0 4px 10px #3c29120b}.thumb{height:54px;border:1px solid #967a56;border-radius:4px;background:linear-gradient(145deg,#6f5941,#b19870 48%,#4d3c2c);position:relative;overflow:hidden}.thumb:after{content:"";position:absolute;left:8px;right:8px;bottom:7px;height:26px;background:linear-gradient(145deg,transparent 30%,#392d2360 31% 45%,transparent 46%),linear-gradient(35deg,transparent 35%,#3e30235d 36% 57%,transparent 58%)}.day span{display:block}.day .n{font-size:13px;font-weight:600}.day strong{display:block;font-size:19px;line-height:1.05;margin-top:2px}.day small{display:block;color:var(--muted);margin-top:4px}.add{width:100%;margin-top:14px;min-height:42px;border:1px solid #73523636;border-radius:8px;background:#fff2;cursor:pointer}.entryhead{display:flex;justify-content:space-between;gap:20px;margin-bottom:14px}.daylabel{font-weight:600;margin:0;font-size:17px}.actions{display:flex;gap:4px}.iconbtn{width:34px;height:34px;border:0;background:transparent;font-size:20px;cursor:pointer}.hero{height:230px;border:1px solid #7a57363d;border-radius:4px;position:relative;overflow:hidden;margin-bottom:17px;background:radial-gradient(circle at 63% 24%,#f1d69e55,transparent 13%),linear-gradient(180deg,#6a7682,#9b9480 35%,#aa9270 36%,#756649 62%,#4a3e31)}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(140deg,transparent 0 40%,#28302d88 41% 48%,transparent 49%),linear-gradient(35deg,transparent 0 45%,#37403d77 46% 56%,transparent 57%)}.hero figcaption{position:absolute;right:15px;top:14px;width:210px;background:#efe0bdcc;border:1px solid #6a4d3426;padding:9px 11px;font-style:italic;text-align:right}.sectionrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}.sectionrow b{font-family:Cinzel,serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase}.sectionrow span{font-size:13px;color:#7a6653}.toolbar{display:flex;gap:4px;align-items:center;overflow-x:auto;padding:8px 10px;min-height:58px;border-radius:999px;background:linear-gradient(#211714,#100c0a);box-shadow:inset 0 1px #ffffff12,0 10px 24px #0004;margin-bottom:16px;scrollbar-width:none}.tool{flex:0 0 auto;width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:#eee;cursor:pointer;font-family:Georgia,serif}.tool:hover{background:#ffffff12}.entrybody{display:grid;grid-template-columns:1fr 180px;gap:23px}.copy p{font-size:17px;line-height:1.4;margin:0 0 13px}.note{background:#e2c28c;padding:18px 15px 12px;border:1px solid #75502d3a;box-shadow:4px 6px 12px #4b311b22;font-style:italic;align-self:start;position:relative}.note:before{content:"";position:absolute;width:62px;height:13px;background:#b28d5855;left:50%;top:-7px;transform:translateX(-50%) rotate(-3deg)}.note p{margin:0 0 8px}.sketch{position:absolute;left:38px;right:34px;bottom:20px;height:105px;opacity:.63}.sketch svg{width:100%;height:100%}.placeholder{padding-top:50px}.cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.card{border:1px solid #7f65453d;background:#ffffff14;border-radius:7px;padding:14px;min-height:125px;cursor:pointer}.card b{font-size:20px;display:block}.card small{color:var(--muted)}.portrait{height:190px;background:linear-gradient(145deg,#6d6253,#9e8667 52%,#4d443b);border:1px solid #816747;margin:18px 0}.mobileBack{display:none}
@media(max-width:760px){.scene{display:block;padding:35px 8px 20px;background:linear-gradient(120deg,#130c09,#25140e 65%,#130b08)}.brand{display:none}.book{width:min(100%,430px);min-width:0;min-height:0;aspect-ratio:auto;margin:0 auto}.cover{inset:-8px -6px;border-radius:14px}.tabs{top:-21px;left:10px;right:10px;gap:4px}.tab{min-width:0;flex:1;height:44px;padding:0 7px 8px;font-size:14px}.tab.active{height:48px}.spread{display:block;min-height:0}.page{padding:24px 17px 25px;min-height:auto}.page.right{display:none}.book.detail .page.left{display:none}.book.detail .page.right{display:block}.gutter{display:none}.head{min-height:62px;margin-bottom:13px}.mountain{display:none}h1{font-size:29px}h2{font-size:30px}.days{gap:6px}.day{grid-template-columns:58px 1fr 14px;gap:9px;min-height:66px;padding:7px}.thumb{height:44px}.day strong{font-size:17px}.hero{height:165px;margin-bottom:13px}.hero figcaption{width:150px;font-size:12px;padding:7px 8px}.entryhead{margin-bottom:10px}.sectionrow span{display:none}.toolbar{position:sticky;bottom:12px;z-index:10;min-height:54px;padding:7px 9px}.tool{width:36px;height:36px}.entrybody{grid-template-columns:1fr;gap:12px}.copy p{font-size:17px;line-height:1.4}.note{width:90%;margin-left:auto}.sketch{position:relative;left:auto;right:auto;bottom:auto;margin-top:16px;height:90px}.cardgrid{grid-template-columns:1fr;gap:8px}.card{min-height:88px}.placeholder{padding-top:26px}.mobileBack{position:fixed;left:12px;top:9px;z-index:30;border:1px solid #c29a625e;border-radius:18px;background:#241711ef;color:#dfc49a;padding:8px 11px;box-shadow:0 2px 8px #0005}.mobileBack.show{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const days=[['Дорога через перевал','12 окт. 2024'],['Таверна у моста','19 окт. 2024'],['Руины сторожевой башни','2 нояб. 2024'],['Тени в лесу','16 нояб. 2024'],['Забытая обитель','30 нояб. 2024'],['Сердце тумана','14 дек. 2024']];
const characters=[['Казл','Человек · Следопыт'],['Лиразэль','Эльф · Маг'],['Вром','Дварф · Воин'],['Серафина','Человек · Жрица'],['Морг','Полуорк · Плут']];
const atlas=[['Чёрная Гавань','Место'],['Орден Пепельной Звезды','Организация'],['Серебряный компас','Предмет'],['Туманный зверь','Существо']];
let state={tab:'chronicles',day:0,detail:false};
const app=document.querySelector('#app');
function tabs(){return `<nav class="tabs">${[['chronicles','Хроники'],['characters','Персонажи'],['atlas','Атлас']].map(([id,n])=>`<button class="tab ${state.tab===id?'active':''}" data-tab="${id}">${n}</button>`).join('')}</nav>`}
function left(){if(state.tab==='chronicles')return `<section class="page left"><div class="head"><div><p class="kicker">Путевой журнал</p><h1>Туманы Вельмора</h1><p class="meta">Кампания · 6 записей</p></div><svg class="mountain" viewBox="0 0 190 62"><path d="M5 55 40 27l17 13 25-31 24 33 15-18 29 31M19 55h153M42 28l8 27M82 9 91 55M118 25l10 30"/></svg></div><div class="days">${days.map((d,i)=>`<button class="day ${state.day===i?'active':''}" data-day="${i}"><span class="thumb"></span><span><span class="n">Игровой день ${i+1}</span><strong>${d[0]}</strong><small>${d[1]}</small></span><b>›</b></button>`).join('')}</div><button class="add">＋ Добавить игровой день</button></section>`;if(state.tab==='characters')return `<section class="page left placeholder"><p class="kicker">Люди и спутники</p><h1>Персонажи</h1><p class="meta">Карточки тех, кого встретил путешественник.</p><div class="cardgrid">${characters.map((c,i)=>`<button class="card" data-card="${i}"><b>${c[0]}</b><small>${c[1]}</small></button>`).join('')}</div></section>`;return `<section class="page left placeholder"><p class="kicker">Места, находки, легенды</p><h1>Атлас</h1><p class="meta">Личная энциклопедия мира, собранная по пути.</p><div class="cardgrid">${atlas.map((c,i)=>`<button class="card" data-card="${i}"><b>${c[0]}</b><small>${c[1]}</small></button>`).join('')}</div></section>`}
function right(){if(state.tab==='chronicles'){const d=days[state.day];return `<article class="page right"><div class="entryhead"><div><p class="daylabel">Игровой день ${state.day+1}</p><h2>${d[0]}</h2><p class="meta">${d[1]}</p></div><div class="actions"><button class="iconbtn">•••</button><button class="iconbtn">♧</button></div></div><figure class="hero"><figcaption>«В каждом тумане скрывается новая дорога»</figcaption></figure><div class="sectionrow"><b>История</b><span>Редактирование записи</span></div><div class="toolbar">${['✦','＋','T','◉','▧','⇄','↶','☺','◌','⌨'].map(x=>`<button class="tool">${x}</button>`).join('')}</div><div class="entrybody"><div class="copy"><p>Мы покинули Сторожевую и взяли курс на северный перевал. Дорога оказалась труднее, чем мы ожидали: снег, камни и странные следы, уходящие в туман.</p><p>К вечеру нашли старый лагерь, но в нём уже давно никто не жил. У кострища лежали осколки амулета с незнакомым клеймом.</p><p>Кажется, кто-то следил за нами. Перед следующей игрой нужно вернуться к этой метке.</p></div><aside class="note"><p>Следы были слишком крупные.</p><p>Волк? Или что-то другое?</p></aside></div><div class="sketch"><svg viewBox="0 0 610 110"><path d="M5 100h600M35 100l68-55 37 28 63-70 80 88 40-45 62 54M392 100c30-45 51-42 77-20 24 20 45-17 77 20"/></svg></div></article>`}if(state.tab==='characters'){const c=characters[0];return `<article class="page right placeholder"><p class="kicker">Запись о персонаже</p><h2>${c[0]}</h2><p class="meta">${c[1]}</p><div class="portrait"></div><h3>Заметки путешественника</h3><p>Знает северные тропы лучше любого проводника. Говорит мало, но замечает детали, которые остальные пропускают.</p><p><i>Не забыть спросить о знаке на его плаще.</i></p></article>`}return `<article class="page right placeholder"><p class="kicker">Запись атласа</p><h2>Чёрная Гавань</h2><p class="meta">Место · Город · Прибрежные земли</p><div class="portrait"></div><p>Крупный торговый порт на западе Вельмора. Известен свободной гаванью, пёстрым народом и тёмными слухами.</p><h3>Связанные записи</h3><p>Игровой день 2 · Орден Пепельной Звезды · Казл</p></article>`}
function render(){app.innerHTML=`<main class="scene"><div class="brand"><span style="font-size:36px">✥</span><span><b>Путевой дневник</b><small>Миры · Люди · Истории</small></span></div><section class="book ${state.detail?'detail':''}"><div class="cover"></div>${tabs()}<div class="spread">${left()}${right()}<div class="gutter"></div></div></section><button class="mobileBack ${state.detail?'show':''}" id="back">‹ Назад</button></main>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.detail=false;render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.day=+b.dataset.day;state.detail=matchMedia('(max-width:760px)').matches;render()});document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{state.detail=matchMedia('(max-width:760px)').matches;render()});document.querySelector('#back')?.addEventListener('click',()=>{state.detail=false;render()})}render();
</script>
</body></html>
